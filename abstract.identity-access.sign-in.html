<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · Abstract</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { display: none; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { inter: ['Inter', 'sans-serif'] },
                colors: {
                    navy: { DEFAULT:'#172554', 700:'#162F7B', 800:'#0F1F52', 900:'#172554' },
                    brand: { blue:'#1D4ED8', purple:'#5B2E91', navy:'#172554' }
                }
            }}
        }
    </script>
</head>
<body class="font-inter" style="background: linear-gradient(160deg, #0f1a3e 0%, #172554 35%, #1e1a4a 65%, #2d1a5e 100%);">

<main class="min-h-screen flex items-center justify-center px-4 py-10 relative overflow-hidden">

    <!-- Soft brand glows -->
    <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full opacity-20" style="background: radial-gradient(circle, #1D4ED8 0%, transparent 70%);"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full opacity-15" style="background: radial-gradient(circle, #5B2E91 0%, transparent 70%);"></div>
    </div>

    <div class="w-full max-w-[400px] relative z-10">

        <!-- Logo on the gradient -->
        <div class="flex justify-center mb-6">
            <img id="brand-logo" src="logo.png" alt="Abstract VMS" class="h-24 w-auto"
                 onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block';"/>
            <div id="logo-fallback" style="display:none;" class="text-center">
                <span class="text-white font-bold text-3xl tracking-tight">Abstract</span>
                <span class="block text-white/60 text-sm font-bold uppercase tracking-[0.3em] mt-1">VMS</span>
            </div>
        </div>

        <!-- Product identity -->
        <div class="flex flex-col items-center gap-2 mb-8">
            <span class="text-[11px] font-semibold uppercase tracking-[0.2em] text-white/50">Admin Portal</span>
        </div>

        <!-- Card -->
        <div class="bg-white border border-white/20 rounded-2xl shadow-2xl overflow-hidden">
            <div class="px-8 pt-8 pb-8">

                <!-- Signed-out / access banner (filled by slice1-kit.js from ?reason=) -->
                <div id="s1-signout-banner" class="mb-5"></div>

                <!-- Form -->
                <form id="login-form" class="flex flex-col gap-5" onsubmit="return false;">

                    <!-- Email -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-semibold text-slate-700" for="email">Email</label>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none">
                                <i class="fa-regular fa-envelope text-slate-400 text-sm"></i>
                            </div>
                            <input type="email" id="email" autocomplete="username" placeholder="you@abstract.com"
                                class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-blue-50 transition-all duration-200"/>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-semibold text-slate-700" for="password">Password</label>
                            <a href="#" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition-colors">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400 text-sm"></i>
                            </div>
                            <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password"
                                class="w-full pl-11 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-blue-50 transition-all duration-200"/>
                            <button type="button" id="toggle-pw" aria-label="Show password"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                                <i class="fa-regular fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button id="login-submit" type="submit"
                        data-s1-home onclick="window.location.href=(window.S1 &amp;&amp; S1.home) ? S1.home() : 'abstract.shell.dashboard.html'; return false;"
                        class="w-full py-3.5 rounded-lg text-white font-semibold text-sm flex items-center justify-center gap-2 transition-all duration-200 hover:opacity-95 hover:shadow-lg active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-blue-100 mt-1"
                        style="background: linear-gradient(135deg, #1D4ED8, #5B2E91);">
                        <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i> Sign in
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-white/40 mt-6">© 2026 Abstract Recruitment</p>
    </div>
</main>

<script>
    const togglePw = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    if (togglePw && pwInput) {
        togglePw.addEventListener('click', function () {
            const show = pwInput.type === 'password';
            pwInput.type = show ? 'text' : 'password';
            togglePw.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
            togglePw.innerHTML = show
                ? '<i class="fa-regular fa-eye-slash text-sm"></i>'
                : '<i class="fa-regular fa-eye text-sm"></i>';
        });
    }
</script>

<script src="slice1-kit.js"></script>
</body>
</html>
